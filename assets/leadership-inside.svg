<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d">
<title id="t">Leadership under pressure illustration</title><desc id="d">Colorful abstract orbs representing urgency, control, approval, curiosity and courage moving around a central leadership decision.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6fdcc6"/><stop offset=".48" stop-color="#74a9f1"/><stop offset="1" stop-color="#9b7ee1"/></linearGradient><filter id="sh"><feDropShadow dx="8" dy="10" stdDeviation="0" flood-color="#2d2a45" flood-opacity="1"/></filter></defs>
<rect width="900" height="620" rx="44" fill="url(#bg)"/>
<circle cx="120" cy="90" r="112" fill="#ffe86a" opacity=".95"/><circle cx="785" cy="92" r="104" fill="#ffad7d" opacity=".9"/><circle cx="790" cy="520" r="120" fill="#efb0cf" opacity=".9"/><circle cx="120" cy="520" r="118" fill="#bdf3e5" opacity=".9"/>
<path d="M210 309 C300 170 590 164 686 305 C598 454 308 466 210 309Z" fill="#ffffff" opacity=".16" stroke="#ffffff" stroke-width="3"/>
<g filter="url(#sh)"><circle cx="450" cy="310" r="118" fill="#6250a5" stroke="#2d2a45" stroke-width="5"/><text x="450" y="285" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="25">YOU'RE THE</text><text x="450" y="326" text-anchor="middle" fill="#ffe85b" font-family="Georgia,serif" font-weight="700" font-size="42">SUPERVISOR</text><text x="450" y="365" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="22">NOW WHAT?</text></g>
<g filter="url(#sh)"><rect x="65" y="125" width="210" height="108" rx="24" fill="#ffdccb" stroke="#2d2a45" stroke-width="4"/><text x="88" y="163" fill="#ff6f32" font-family="Arial,sans-serif" font-size="17" font-weight="700">URGENCY</text><text x="88" y="201" fill="#2d2a45" font-family="Georgia,serif" font-size="29" font-weight="700">Fix it. Now.</text></g>
<g filter="url(#sh)"><rect x="618" y="132" width="210" height="108" rx="24" fill="#e8ddff" stroke="#2d2a45" stroke-width="4"/><text x="642" y="170" fill="#6550a5" font-family="Arial,sans-serif" font-size="17" font-weight="700">CONTROL</text><text x="642" y="208" fill="#2d2a45" font-family="Georgia,serif" font-size="29" font-weight="700">Take over.</text></g>
<g filter="url(#sh)"><rect x="75" y="410" width="226" height="108" rx="24" fill="#ffd9e9" stroke="#2d2a45" stroke-width="4"/><text x="98" y="448" fill="#d85d9b" font-family="Arial,sans-serif" font-size="17" font-weight="700">APPROVAL</text><text x="98" y="486" fill="#2d2a45" font-family="Georgia,serif" font-size="27" font-weight="700">Don't upset them.</text></g>
<g filter="url(#sh)"><rect x="602" y="410" width="236" height="108" rx="24" fill="#c9f4e8" stroke="#2d2a45" stroke-width="4"/><text x="626" y="448" fill="#148d78" font-family="Arial,sans-serif" font-size="17" font-weight="700">CURIOSITY</text><text x="626" y="486" fill="#2d2a45" font-family="Georgia,serif" font-size="27" font-weight="700">Tell me more.</text></g>
<g filter="url(#sh)"><rect x="335" y="44" width="232" height="88" rx="44" fill="#d9e8ff" stroke="#2d2a45" stroke-width="4"/><text x="451" y="79" text-anchor="middle" fill="#397be8" font-family="Arial,sans-serif" font-size="16" font-weight="700">COURAGE</text><text x="451" y="109" text-anchor="middle" fill="#2d2a45" font-family="Georgia,serif" font-size="24" font-weight="700">Say the hard thing.</text></g>
<g fill="#fff" opacity=".9"><circle cx="322" cy="245" r="8"/><circle cx="575" cy="246" r="8"/><circle cx="329" cy="381" r="8"/><circle cx="573" cy="380" r="8"/></g>
</svg>